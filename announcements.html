<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">

<body class="clubs-page announcements-page">
	<header class="navbar nav-scroll">
		<div class="nav-left"><a href="./index.html" class="brand-logo-link"><img src="./logo-banner.png" alt="DIEUNW Logo" class="custom-brand-logo"></a></div>
		<nav class="nav-menu" aria-label="Điều hướng chính">
			<a href="./index.html" class="nav-item">Trang chủ</a>
			<a href="./videos.html" class="nav-item">Video</a>
			<a href="./music.html" class="nav-item">Kho nhạc</a>
			<a href="./tu-hoc.html" class="nav-item">Phòng tự học</a>
			<a href="./hoc-nhom.html" class="nav-item">Học nhóm</a>
			<a href="./friends.html" class="nav-item">Bạn bè</a>
			<a href="./messages.html" class="nav-item">Tin nhắn</a>
			<a href="./tro-chuyen.html" class="nav-item">Phòng trò chuyện</a>
			<a href="./clubs.html" class="nav-item">CLB</a>
			<a href="./announcements.html" class="nav-item active" aria-current="page">Thông báo</a>
		</nav>
		<div class="nav-right"><a href="./profile.html" class="nav-avatar-link" aria-label="Trang cá nhân" title="Trang cá nhân"><img class="nav-user-avatar" src="./DIEU.avif" alt=""></a></div>
	</header>

	<main class="announcements-main page-enter">
		<header class="clubs-heading announcements-heading">
			<div>
				<p class="clubs-eyebrow">THÔNG BÁO TỪ CÁC CÂU LẠC BỘ</p>
				<h1>Bảng tin câu lạc bộ</h1>
				<p>Những cập nhật mới nhất từ các CLB NQD.</p>
			</div>
			<a class="clubs-heading-link" href="./clubs.html">Khám phá CLB <span aria-hidden="true">↗</span></a>
		</header>

		<section id="announcement-composer" class="announcement-composer" hidden>
			<form id="announcement-form">
				<label for="announcement-club">Đăng với CLB</label>
				<div class="announcement-composer-row">
					<select id="announcement-club" required></select>
					<button class="clubs-button" type="submit">Đăng thông báo</button>
				</div>
				<textarea id="announcement-content" maxlength="10000" placeholder="Chia sẻ tin tức và hoạt động của CLB..." required></textarea>

				<div class="announcement-attachments-row">
					<div class="announcement-attach-card">
						<div class="image-upload-row">
							<label class="image-upload-label dieunw-file-btn" for="announcement-image-file">Đính kèm ảnh (tùy chọn)</label>
							<input id="announcement-image-file" type="file" accept="image/*" hidden>
							<span id="announcement-image-name" class="image-upload-filename">Không có ảnh</span>
							<button type="button" id="announcement-image-clear" class="btn-clear-upload" hidden>Xóa</button>
						</div>
						<div id="announcement-image-preview-wrap" class="image-preview-wrap" hidden>
							<img id="announcement-image-preview" class="image-preview-thumb" alt="Xem trước ảnh thông báo">
						</div>
					</div>

					<div class="announcement-attach-card">
						<div class="image-upload-row">
							<label class="image-upload-label dieunw-file-btn" for="announcement-file">Đính kèm tệp (tùy chọn)</label>
							<input id="announcement-file" type="file" accept=".pdf,.doc,.docx,.txt,.ppt,.pptx,.xls,.xlsx,.zip,.rar,.png,.jpg,.jpeg" hidden>
							<span id="announcement-file-name" class="image-upload-filename">Không có tệp</span>
							<button type="button" id="announcement-file-clear" class="btn-clear-upload" hidden>Xóa</button>
						</div>
					</div>
				</div>

				<!-- Đính kèm nhạc từ Kho nhạc online hoặc tệp nhạc từ máy -->
				<div id="ann-music-picker"></div>

				<!-- Thanh loading % khi đăng thông báo -->
				<div id="ann-upload-progress"></div>

				<p id="announcement-status" class="clubs-form-status" role="status" aria-live="polite"></p>
			</form>
		</section>

		<p id="announcement-feed-status" class="clubs-form-status" role="status" aria-live="polite"></p>
		<section id="announcement-feed" class="announcement-feed" aria-live="polite"></section>
	</main>

	<script src="./nav-profile.js?v=9" defer></script>
	<script src="./announcements.js?v=9" defer></script>
	<script>
(() => {
	if (window.__dieunwCoreReady) return;
	window.__dieunwCoreReady = true;

	const API_BASE = "https://dieunw.onrender.com";
	const THEME_KEY = "dieunw_theme";
	const MUSIC_STATE_KEY = "dieunw_global_music_state";

	// 1. ĐỒNG BỘ CHẾ ĐỘ SÁNG / TỐI TOÀN SITE
	function applyGlobalTheme(isDark) {
		document.documentElement.classList.toggle("dark-mode", isDark);
		document.body?.classList.toggle("dark-mode", isDark);
		document.body?.classList.toggle("theme-dark", isDark);
		localStorage.setItem(THEME_KEY, isDark ? "dark" : "light");
		localStorage.setItem("darkMode", isDark ? "1" : "0");
		document.querySelectorAll("#nav-theme-toggle, .nav-theme-toggle").forEach(btn => {
			btn.textContent = isDark ? "☀️" : "🌙";
			btn.setAttribute("aria-pressed", String(isDark));
		});
	}

	const savedDark = localStorage.getItem(THEME_KEY) === "dark" || localStorage.getItem("darkMode") === "1";
	applyGlobalTheme(savedDark);

	document.addEventListener("click", (e) => {
		const btn = e.target instanceof Element ? e.target.closest("#nav-theme-toggle, .nav-theme-toggle") : null;
		if (!btn) return;
		e.preventDefault();
		const nextDark = !document.documentElement.classList.contains("dark-mode");
		applyGlobalTheme(nextDark);
		if (location.pathname.includes("tu-hoc")) {
			localStorage.setItem("dieunw_study_theme", nextDark ? "dark" : "default");
			const sel = document.getElementById("theme-selector");
			if (sel) sel.value = nextDark ? "dark" : "default";
		}
	});

	// 2. TRÌNH PHÁT NHẠC NỀN XUYÊN TRANG KHÔNG NGẮT QUÃNG + SHUFFLE
	let globalAudio = document.getElementById("dieunw-global-audio");
	if (!globalAudio) {
		globalAudio = document.createElement("audio");
		globalAudio.id = "dieunw-global-audio";
		globalAudio.preload = "auto";
		document.body.appendChild(globalAudio);
	}

	let state = {
		track: null,
		queue: [],
		currentTime: 0,
		isPlaying: false,
		shuffle: localStorage.getItem("dieunw_music_shuffle") === "1"
	};

	try {
		const raw = JSON.parse(localStorage.getItem(MUSIC_STATE_KEY) || "null");
		if (raw && typeof raw === "object") state = { ...state, ...raw };
	} catch {}

	function saveMusicState() {
		state.currentTime = Number(globalAudio.currentTime || 0);
		state.isPlaying = Boolean(!globalAudio.paused && globalAudio.src);
		localStorage.setItem(MUSIC_STATE_KEY, JSON.stringify(state));
	}

	function resolveUrl(u) {
		const s = String(u || "").trim();
		if (!s) return "";
		return s.startsWith("/uploads/") ? `${API_BASE}${s}` : s;
	}

	function playNextGlobal(step = 1) {
		if (!Array.isArray(state.queue) || !state.queue.length) return;
		const idx = state.queue.findIndex(t => String(t.id) === String(state.track?.id));
		let nextIdx = 0;
		if (state.shuffle && state.queue.length > 1) {
			nextIdx = idx;
			while (nextIdx === idx) nextIdx = Math.floor(Math.random() * state.queue.length);
		} else {
			nextIdx = idx === -1 ? 0 : (idx + step + state.queue.length) % state.queue.length;
		}
		window.dieunwPlayGlobalTrack(state.queue[nextIdx], state.queue);
	}

	window.dieunwPlayGlobalTrack = (track, queue = []) => {
		if (!track?.audioUrl) return;
		state.track = { ...track, audioUrl: resolveUrl(track.audioUrl) };
		if (Array.isArray(queue) && queue.length) {
			state.queue = queue.map(q => ({ ...q, audioUrl: resolveUrl(q.audioUrl) }));
		}
		if (typeof track.shuffle === "boolean") state.shuffle = track.shuffle;

		const startAt = Number(track.startTime || 0);
		globalAudio.src = state.track.audioUrl;
		globalAudio.onloadedmetadata = () => {
			if (startAt > 0 && startAt < globalAudio.duration) {
				globalAudio.currentTime = startAt;
			}
			globalAudio.play().catch(() => {});
		};
		globalAudio.play().catch(() => {});
		saveMusicState();
	};

	window.dieunwPauseGlobalMusic = () => {
		globalAudio.pause();
		state.isPlaying = false;
		saveMusicState();
	};

	globalAudio.addEventListener("timeupdate", () => {
		if (Math.floor(globalAudio.currentTime) % 2 === 0) saveMusicState();
	});
	globalAudio.addEventListener("ended", () => playNextGlobal(1));
	window.addEventListener("beforeunload", saveMusicState);
	window.addEventListener("pagehide", saveMusicState);

	// Khôi phục phát nhạc ngay lập tức khi vừa chuyển sang trang mới
	if (state.track?.audioUrl && state.isPlaying) {
		globalAudio.src = resolveUrl(state.track.audioUrl);
		const resumeAt = Number(state.currentTime || 0);
		globalAudio.addEventListener("loadedmetadata", () => {
			if (resumeAt > 0 && resumeAt < globalAudio.duration) {
				globalAudio.currentTime = resumeAt;
			}
			globalAudio.play().catch(() => {
				const resumeOnTap = () => {
					globalAudio.play().catch(() => {});
					document.removeEventListener("pointerdown", resumeOnTap);
				};
				document.addEventListener("pointerdown", resumeOnTap, { once: true });
			});
		}, { once: true });
	}
})();
</script>

</body>
</html>
